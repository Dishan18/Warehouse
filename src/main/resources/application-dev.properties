# Database - Supabase Cloud PostgreSQL (Session pooler, IPv4 compatible)
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.ppxhxpwpwrkdayljtsfg}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Connection pool — keep a small pool; Supabase free tier limits connections
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# Server
server.port=8080

# JWT
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=86400000

# Default admin (seeded on first startup)
application.admin.email=${ADMIN_EMAIL:admin@warehouse.com}
application.admin.password=${ADMIN_PASSWORD:Admin@123}

